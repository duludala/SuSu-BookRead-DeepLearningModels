[project]
name = "deeplearningmodels"
version = "0.1.0"
description = "基于图像识别的二手书信息提取深度学习模型"
readme = "README.md"
authors = [
    { name = "QueridaM", email = "1977548310@qq.com" }
]
requires-python = ">=3.10"

dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "opencv-python>=4.9.0",
  "pillow>=10.3.0",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pre-commit>=3.7.0",
]

# ==============================================
# uv全局配置（消除hardlink警告）
# ==============================================
[tool.uv]
link-mode = "copy"  # ✅ 移到这里了！

# ==============================================
# ruff全局配置
# ==============================================
[tool.ruff]
line-length = 120
target-version = "py310"
fix = true
unsafe-fixes = true
indent-width = 4

# ==============================================
# 代码格式化配置
# ==============================================
[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
indent-style = "space"

# ==============================================
# 代码检查配置（只使用我们启用的规则）
# ==============================================
[tool.ruff.lint]
# 只启用你需要的4个核心规则集
extend-select = [
  "E",  # pycodestyle 格式错误
  "W",  # pycodestyle 格式警告
  "F",  # pyflakes 逻辑错误（未使用变量/函数/导入、重复定义）
  "I",  # isort 导入排序
]

# 全局例外规则
ignore = [
  "E501",  # 行长度由line-length控制
  "F401",  # 允许__init__.py导入未使用的模块
  "F403",  # 允许from module import *（模型文件常用）
  "E731",  # 允许lambda表达式赋值给变量
]

# 特定文件例外规则（只使用存在的规则）
per-file-ignores = {
  "__init__.py" = ["F401"],
  "train.py" = ["E501", "T20"],
  "inference.py" = ["E501", "T20"],
  "models/**/*.py" = ["B008", "E501"],
  "utils/**/*.py" = ["B008"]
}